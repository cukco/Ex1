$kind: http-example
name: 201 - Success
request:
  method: POST
  url: '{{baseUrl}}/candidates'
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "fullName": "Nguyen Van A",
        "email": "nguyenvana@example.com",
        "age": 25,
        "yearsOfExperience": 3
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "id": 1,
        "fullName": "Nguyen Van A",
        "email": "nguyenvana@example.com",
        "age": 25,
        "yearsOfExperience": 3
      }
