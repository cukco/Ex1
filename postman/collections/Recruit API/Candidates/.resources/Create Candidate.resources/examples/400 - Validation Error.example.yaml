$kind: http-example
name: 400 - Validation Error
request:
  method: POST
  url: '{{baseUrl}}/candidates'
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "fullName": "AB",
        "email": "not-an-email",
        "age": 16,
        "yearsOfExperience": -1
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: text
    content: '"Tên phải từ 5 đến 50 ký tự"'
