$kind: http-request
name: Create Candidate
description: 'Create a new candidate. Returns 201 on success, 400 on validation error.'
method: POST
url: '{{baseUrl}}/candidates'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "fullName": "Nguyen Van A",
      "email": "nguyenvana@example.com",
      "age": 25,
      "yearsOfExperience": 3
    }
examples: './.resources/Create Candidate.resources/examples'
